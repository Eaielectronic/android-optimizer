modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Eaielectronic/native-gl-engine/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    description = '''
        Moteur de rendu natif Android pour Minecraft Java Edition.
        Compilation shader async (GLSL → SPIR-V), cache SHA-256 persistant,
        gestion mémoire GPU via VMA, interception GL avec déduplication d'état.
        Se connecte à Android Optimizer si présent pour les réglages unifiés.
    '''

[[mixins]]
    config = "nativeglengine.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${loader_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Dépendance optionnelle vers Android Optimizer
[[dependencies.${mod_id}]]
    modId = "androidopt"
    type = "optional"
    versionRange = "[1.0.5,)"
    ordering = "AFTER"
    side = "CLIENT"
